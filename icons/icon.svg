<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" stroke="#334155" stroke-width="8" />
  
  <!-- Outer glowing gym ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="24" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#primary-grad)" stroke-width="12" stroke-dasharray="1000" stroke-dashoffset="150" stroke-linecap="round" filter="url(#glow)" />

  <!-- Barbell Plates & Shaft Motif -->
  <!-- Left Weight Plates -->
  <rect x="110" y="216" width="16" height="80" rx="6" fill="#f59e0b" />
  <rect x="134" y="196" width="20" height="120" rx="8" fill="#06b6d4" />
  <rect x="160" y="226" width="14" height="60" rx="5" fill="#334155" />

  <!-- Right Weight Plates -->
  <rect x="338" y="226" width="14" height="60" rx="5" fill="#334155" />
  <rect x="358" y="196" width="20" height="120" rx="8" fill="#06b6d4" />
  <rect x="386" y="216" width="16" height="80" rx="6" fill="#f59e0b" />

  <!-- Center Barbell Knurled Bar -->
  <rect x="120" y="248" width="272" height="16" rx="8" fill="#94a3b8" />

  <!-- Central Stylized "O" / Spartan Shield Diamond -->
  <path d="M 256 120 L 320 256 L 256 392 L 192 256 Z" fill="none" stroke="url(#primary-grad)" stroke-width="22" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="256" cy="256" r="32" fill="#ef4444" />
  
  <!-- Lightning Bolt Energy Core -->
  <polygon points="262,190 234,260 258,260 248,322 284,244 260,244" fill="#ffffff" filter="url(#glow)" />
</svg>
